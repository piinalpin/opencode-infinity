# Contoh offline provisional, bukan konfigurasi deployment aktif/default final.
version: 1
server:
  listen: 127.0.0.1:8787
  admin_listen: 127.0.0.1:8788
  gateway_token_env: INFINITY_GATEWAY_TOKEN
  admin_token_env: INFINITY_ADMIN_TOKEN
  default_upstream: primary
  max_body_bytes: 10485760
  max_active_requests: 20
limits:
  body_buffer_bytes: 67108864
  stream_buffer_bytes: 8388608
  state_bytes: 16777216
  monitoring_bytes: 8388608
  inbound_connections: 64
  outbound_connections: 32
  bindings: 1024
  admin_sessions: 32
  parallel_probes: 2
  parallel_status: 4
  snapshot_bytes: 262144
timeouts:
  connect_seconds: 10
  response_headers_seconds: 120
  stream_idle_seconds: 120
  total_request_seconds: 1800
relays:
  - id: warp-1
    proxy_url: socks5h://warp-1:1080
    max_inflight: 5
upstreams:
  - id: primary
    base_url: https://api.provider.example/v1
    api_key_env: INFINITY_UPSTREAM_KEY
    relays: [warp-1]
    models:
      - alias: coding-default
        upstream_model: provider-model-id
        routing: fixed
        primary_relay: warp-1
        fallback_relays: []
        affinity: none
